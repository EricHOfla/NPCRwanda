services:
  db:
    image: postgres:16-alpine
    container_name: npc_rwanda_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: npc_rwanda_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d npc_rwanda_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: