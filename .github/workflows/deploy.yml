name: Deploy NPCRwanda

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deployments against the same VPS at the same time.
concurrency:
  group: npcrwanda-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m

          script: |
            set -Eeuo pipefail

            cd /var/www/NPCRwanda

            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🧹 Removing stale dependencies..."
            rm -rf node_modules

            echo "📦 Installing dependencies..."
            if ! npm ci --no-audit --no-fund; then
              echo "⚠️ Dependency installation failed. Cleaning npm cache and retrying once..."
              rm -rf node_modules
              npm cache clean --force
              npm ci --no-audit --no-fund
            fi

            echo "🔧 Generating Prisma Client..."
            npx prisma generate

            echo "🏗️ Building Next.js..."
            npm run build

            echo "🔐 Fixing permissions..."
            chmod -R a+rX /var/www/NPCRwanda

            echo "♻️ Restarting PM2..."
            pm2 restart npcrwanda
            pm2 save

            echo "🔄 Reloading Nginx..."
            systemctl reload nginx

            echo "🔎 Checking application process..."
            pm2 describe npcrwanda

            echo "✅ Deployment completed successfully!"
