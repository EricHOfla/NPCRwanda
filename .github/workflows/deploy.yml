name: Deploy NPCRwanda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /var/www/NPCRwanda
            git pull origin main
            npm ci --omit=dev
            npm run build
            pm2 restart NPCRwanda || pm2 start npm --name NPCRwanda -- start
